<html>
<head>
<title>Mouse Over</title>
</head>
<body align="center">
<h1 id="text">Hello</h1>
<img src="img1.jpeg"
     onmouseover="onmouse()"
     onmouseout="outmouse()"
     id="image"
     width="200"
     height="200">
<script>
function onmouse() {
    document.getElementById("text").innerHTML = "Welcome to my page";
    document.getElementById("image").src = "/home/ksb/risanaweb10/image3.jpg";
}
function outmouse() {
    document.getElementById("text").innerHTML = "Hello world";
    document.getElementById("image").src = "/home/ksb/risanaweb10/image1.jpg";
}
</script>
</body>
</html>
